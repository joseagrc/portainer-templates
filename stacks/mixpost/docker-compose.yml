services:
  mixpost:
    container_name: ${COMPOSE_PROJECT_NAME:-mixpost}-app
    image: ${MIXPOST_IMAGE:-inovector/mixpost}:${MIXPOST_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Mixpost}
      APP_KEY: ${APP_KEY:?APP_KEY requerido}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN requerido}
      APP_URL: ${APP_URL:-https://${APP_DOMAIN}}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-mixpost_db}
      DB_USERNAME: ${DB_USERNAME:-mixpost_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
    volumes:
      - mixpost_storage:/var/www/html/storage/app
      - mixpost_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK:-proxy}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}-http.middlewares=${COMPOSE_PROJECT_NAME:-mixpost}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.service=${COMPOSE_PROJECT_NAME:-mixpost}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-mixpost}-headers.headers.STSPreload=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-mixpost}.middlewares=${COMPOSE_PROJECT_NAME:-mixpost}-headers"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-mixpost}.loadbalancer.server.port=80"

  mysql:
    container_name: ${COMPOSE_PROJECT_NAME:-mixpost}-mysql
    image: ${MYSQL_IMAGE:-mysql}:${MYSQL_TAG:-8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mixpost_db}
      MYSQL_USER: ${DB_USERNAME:-mixpost_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido}
    volumes:
      - mixpost_mysql:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-mixpost}-redis
    image: ${REDIS_IMAGE:-redis}:${REDIS_TAG:-7-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes --replica-read-only no
    volumes:
      - mixpost_redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mixpost_mysql:
  mixpost_redis:
  mixpost_storage:
  mixpost_logs:

networks:
  default:
    name: ${NETWORK:-proxy}
    external: true
  internal:
    name: ${COMPOSE_PROJECT_NAME:-mixpost}_internal
