services:
  beszel-agent:
    container_name: ${COMPOSE_PROJECT_NAME:-beszel-agent}
    image: ${BESZEL_AGENT_IMAGE:-henrygd/beszel-agent}:${BESZEL_AGENT_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: ${BESZEL_AGENT_LISTEN:-45876}
      HUB_URL: ${BESZEL_HUB_URL}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}

volumes:
  beszel_agent_data:
