services:
  runner:
    image: ${GITEA_ACT_RUNNER_IMAGE}:${GITEA_ACT_RUNNER_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x act_runner >/dev/null || pgrep -x gitea-runner >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    working_dir: /data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cd /data
        act_runner generate-config > /data/config.yaml
        sed -i 's|network: ""|network: "${NETWORK}"|' /data/config.yaml
        sed -i 's|^  options:.*|  options: --dns=1.1.1.1 --dns=8.8.8.8|' /data/config.yaml
        if [ ! -f .runner ]; then
          act_runner register --no-interactive \
            --instance "$${GITEA_INSTANCE_URL}" \
            --token "$${GITEA_RUNNER_REGISTRATION_TOKEN}" \
            --name "$${GITEA_RUNNER_NAME}" \
            --labels "$${GITEA_RUNNER_LABELS}"
        fi
        exec act_runner daemon --config /data/config.yaml
    environment:
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${RUNNER_NAME:-server1-runner}"
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-24.04:docker://gitea/runner-images:ubuntu-24.04,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:

networks:
  default:
    name: "${NETWORK}"
    external: true
