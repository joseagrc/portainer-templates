services:
  runner:
    image: ${GITEA_ACT_RUNNER_IMAGE}:${GITEA_ACT_RUNNER_TAG}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        act_runner generate-config > /data/config.yaml
        sed -i 's|network: ""|network: "${NETWORK}"|' /data/config.yaml
        exec act_runner daemon --config /data/config.yaml
    environment:
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${RUNNER_NAME:-server1-runner}"
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-24.04:docker://gitea/runner-images:ubuntu-24.04,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:

networks:
  default:
    name: "${NETWORK}"
    external: true
