x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  frontend:
    image: ghcr.io/maathimself/mailflow-frontend:${MAILFLOW_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NGINX_TLS: "off"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-mailflow}.rule=Host(`${APP_HOSTNAME}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-mailflow}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-mailflow}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-mailflow}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-mailflow}.service=${COMPOSE_PROJECT_NAME:-mailflow}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-mailflow}.loadbalancer.server.port=80

  backend:
    image: ghcr.io/maathimself/mailflow-backend:${MAILFLOW_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-backend
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailflow}
      DB_USER: ${DB_USER:-mailflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mailflow
      - mailflow-egress

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailflow} -d ${DB_NAME:-mailflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-mailflow}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-mailflow}_redis_data

networks:
  mailflow:
    name: ${COMPOSE_PROJECT_NAME:-mailflow}_internal
    internal: true
  mailflow-egress:
    name: ${COMPOSE_PROJECT_NAME:-mailflow}_egress
  proxy:
    name: ${NETWORK:-proxy}
    external: true
