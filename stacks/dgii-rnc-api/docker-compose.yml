services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-postgres
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_TAG:-16.6-alpine}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dgii_rnc_db}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    volumes:
      - dgii_rnc_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  api:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-app
    image: ${RNC_API_IMAGE:-gitea.joseagrc.com/joseagrc/dgii-rnc-fastapi}:${RNC_API_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - dgii_rnc_data:/app/data
    environment:
      APP_NAME: ${APP_NAME:-DGII RNC FastAPI}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-dgii_rnc_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      DGII_RNC_URL: ${DGII_RNC_URL:-https://dgii.gov.do/app/WebApps/ConsultasWeb2/ConsultasWeb/consultas/rnc.aspx}
      DGII_TIMEOUT: ${DGII_TIMEOUT:-20}
      DGII_ZIP_TIMEOUT: ${DGII_ZIP_TIMEOUT:-120}
      DGII_BATCH_SIZE: ${DGII_BATCH_SIZE:-1000}
      DGII_ZIP_SOURCE: ${DGII_ZIP_SOURCE:-remote}
      DGII_ZIP_FORMAT: ${DGII_ZIP_FORMAT:-csv}
      DGII_RNC_ZIP_LOCAL_PATH: ${DGII_RNC_ZIP_LOCAL_PATH:-}
      DGII_ZIP_DOWNLOAD_RETRIES: ${DGII_ZIP_DOWNLOAD_RETRIES:-3}
      DGII_ZIP_CHUNK_SIZE: ${DGII_ZIP_CHUNK_SIZE:-1048576}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-168}
      HTML_REFRESH_HOURS: ${HTML_REFRESH_HOURS:-24}
      HTML_ENRICHMENT_ENABLED: ${HTML_ENRICHMENT_ENABLED:-true}
      HTML_ENRICHMENT_CRON: "${HTML_ENRICHMENT_CRON:-*/15 * * * *}"
      HTML_ENRICHMENT_BATCH_SIZE: ${HTML_ENRICHMENT_BATCH_SIZE:-25}
      HTML_ENRICHMENT_DELAY_SECONDS: ${HTML_ENRICHMENT_DELAY_SECONDS:-15}
      HTML_ENRICHMENT_JITTER_SECONDS: ${HTML_ENRICHMENT_JITTER_SECONDS:-5}
      HTML_ENRICHMENT_ERROR_DELAY_SECONDS: ${HTML_ENRICHMENT_ERROR_DELAY_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-America/Santo_Domingo}
      SCHEDULER_FULL_SYNC_CRON: "${SCHEDULER_FULL_SYNC_CRON:-0 2 * * *}"
      SCHEDULER_STARTUP_SYNC_ENABLED: ${SCHEDULER_STARTUP_SYNC_ENABLED:-true}
      SCHEDULER_STARTUP_SYNC_CLEAR_EXISTING: ${SCHEDULER_STARTUP_SYNC_CLEAR_EXISTING:-true}
      SCHEDULER_STARTUP_ENRICHMENT_ENABLED: ${SCHEDULER_STARTUP_ENRICHMENT_ENABLED:-true}
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=${RNC_API_TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=${NETWORK:-proxy}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-http.rule=Host(`${URL}`) || Host(`www.${URL}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.rule=Host(`${URL}`) || Host(`www.${URL}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.service=${COMPOSE_PROJECT_NAME:-dgii-rnc-api}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-rnc-api}.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  dgii_rnc_postgres_data:
  dgii_rnc_data:

networks:
  proxy:
    name: ${NETWORK:-proxy}
    external: true
  internal:
    driver: bridge
