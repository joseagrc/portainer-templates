services:
  wazuh-config:
    image: alpine:${ALPINE_TAG:-3.22}
    container_name: ${COMPOSE_PROJECT_NAME:-wazuh}-config
    restart: "no"
    environment:
      WAZUH_API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_config:/config
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /config/wazuh_indexer /config/wazuh_dashboard /config/wazuh_cluster

        cat > /config/certs.yml <<'EOF'
        nodes:
          indexer:
            - name: wazuh.indexer
              ip: wazuh.indexer
          server:
            - name: wazuh.manager
              ip: wazuh.manager
          dashboard:
            - name: wazuh.dashboard
              ip: wazuh.dashboard
        EOF

        cat > /config/wazuh_indexer/wazuh.indexer.yml <<'EOF'
        network.host: "0.0.0.0"
        node.name: "wazuh.indexer"
        cluster.name: "wazuh-cluster"
        path.data: /var/lib/wazuh-indexer
        path.logs: /var/log/wazuh-indexer
        discovery.type: single-node
        compatibility.override_main_response_version: true
        plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
        plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/wazuh.indexer-key.pem
        plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
        plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
        plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/wazuh.indexer-key.pem
        plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
        plugins.security.ssl.http.enabled: true
        plugins.security.ssl.transport.enforce_hostname_verification: false
        plugins.security.ssl.transport.resolve_hostname: false
        plugins.security.authcz.admin_dn:
        - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
        plugins.security.nodes_dn:
        - "CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
        plugins.security.restapi.roles_enabled:
        - "all_access"
        - "security_rest_api_access"
        plugins.security.system_indices.enabled: true
        plugins.security.allow_default_init_securityindex: true
        cluster.routing.allocation.disk.threshold_enabled: false
        EOF

        cat > /config/wazuh_indexer/internal_users.yml <<'EOF'
        ---
        _meta:
          type: "internalusers"
          config_version: 2

        admin:
          hash: "$$2y$$12$$K/SpwjtB.wOHJ/Nc6GVRDuc1h0rM1DfvziFRNPtk27P.c4yDr9njO"
          reserved: true
          backend_roles:
          - "admin"
          description: "Demo admin user"

        kibanaserver:
          hash: "$$2a$$12$$4AcgAt3xwOWadA5s5blL6ev39OXDNhmOesEoo33eZtrq2N0YrU3H."
          reserved: true
          description: "Demo kibanaserver user"
        EOF

        cat > /config/wazuh_dashboard/opensearch_dashboards.yml <<'EOF'
        server.host: 0.0.0.0
        server.port: 5601
        opensearch.hosts: https://wazuh.indexer:9200
        opensearch.ssl.verificationMode: certificate
        opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
        opensearch_security.multitenancy.enabled: false
        opensearch_security.readonly_mode.roles: ["kibana_read_only"]
        opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
        uiSettings.overrides.defaultRoute: /app/wz-home
        opensearch_security.cookie.ttl: 900000
        opensearch_security.session.ttl: 900000
        opensearch_security.session.keepalive: true
        EOF

        cat > /config/wazuh_dashboard/wazuh.yml <<EOF
        hosts:
          - default:
              url: "https://wazuh.manager"
              port: 55000
              username: "$${WAZUH_API_USERNAME}"
              password: "$${WAZUH_API_PASSWORD}"
              run_as: true
        EOF

  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:${WAZUH_CERTS_GENERATOR_TAG:-0.0.4}
    container_name: ${COMPOSE_PROJECT_NAME:-wazuh}-certs-generator
    hostname: wazuh-certs-generator
    restart: "no"
    depends_on:
      wazuh-config:
        condition: service_completed_successfully
    environment:
      CERT_TOOL_VERSION: ${WAZUH_CERT_TOOL_VERSION:-4.14}
    volumes:
      - wazuh_certs:/certificates
      - wazuh_config:/config:ro

  wazuh-indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.6}
    container_name: ${COMPOSE_PROJECT_NAME:-wazuh}-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    environment:
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - wazuh_certs:/usr/share/wazuh-indexer/config/certs:ro
      - wazuh_config:/config:ro
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        cp /config/wazuh_indexer/wazuh.indexer.yml /usr/share/wazuh-indexer/config/opensearch.yml
        cp /config/wazuh_indexer/internal_users.yml /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
        exec /entrypoint.sh opensearch
    networks:
      default:
        aliases:
          - wazuh.indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.6}
    container_name: ${COMPOSE_PROJECT_NAME:-wazuh}-manager
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_started
    ports:
      - "${WAZUH_AGENT_TCP_PORT:-1514}:1514"
      - "${WAZUH_AGENT_ENROLLMENT_PORT:-1515}:1515"
      - "${WAZUH_SYSLOG_UDP_PORT:-514}:514/udp"
      - "${WAZUH_MANAGER_API_PORT:-55000}:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - wazuh_certs:/certs:ro
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        cp /certs/root-ca-manager.pem /etc/ssl/root-ca.pem
        cp /certs/wazuh.manager.pem /etc/ssl/filebeat.pem
        cp /certs/wazuh.manager-key.pem /etc/ssl/filebeat.key
        exec /init
    networks:
      default:
        aliases:
          - wazuh.manager

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.6}
    container_name: ${COMPOSE_PROJECT_NAME:-wazuh}-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_started
      wazuh-manager:
        condition: service_started
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_SYSTEM_PASSWORD:-kibanaserver}
      API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
      - wazuh_certs:/usr/share/wazuh-dashboard/certs:ro
      - wazuh_config:/config:ro
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        cp /config/wazuh_dashboard/opensearch_dashboards.yml /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
        cp /config/wazuh_dashboard/wazuh.yml /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        exec /entrypoint.sh
    networks:
      default:
        aliases:
          - wazuh.dashboard
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK:-proxy}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}-http.rule=Host(`${WAZUH_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}-http.middlewares=${COMPOSE_PROJECT_NAME:-wazuh}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-wazuh}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-wazuh}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}.rule=Host(`${WAZUH_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-wazuh}.service=${COMPOSE_PROJECT_NAME:-wazuh}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-wazuh}.loadbalancer.server.port=5601"

volumes:
  wazuh_config:
  wazuh_certs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:

networks:
  default:
    name: ${NETWORK:-proxy}
    external: true
