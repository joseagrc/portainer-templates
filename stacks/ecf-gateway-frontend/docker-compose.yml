x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  frontend:
    image: ${ECF_GATEWAY_FRONTEND_IMAGE:-gitea.joseagrc.com/joseagrc/ecf-gateway-frontend}:${ECF_GATEWAY_FRONTEND_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_ECF_GATEWAY_API_BASE_URL: ${NEXT_PUBLIC_ECF_GATEWAY_API_BASE_URL:-https://ecf.example.com}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-gzip.compress=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-http.rule=Host(`${URL}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-http.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-http.middlewares=${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-https-redirect
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.rule=Host(`${URL}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.middlewares=${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}-gzip
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-ecf-gateway-frontend}.loadbalancer.server.port=3000
    networks:
      - proxy

networks:
  proxy:
    name: ${NETWORK:-proxy}
    external: true
