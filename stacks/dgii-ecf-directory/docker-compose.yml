services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_TAG:-16.15-alpine}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgii_directory}
      POSTGRES_USER: ${POSTGRES_USER:-dgii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  api:
    image: ${DIRECTORY_IMAGE:-code.unpaismejor.org.do/unpaismejor/dgii-ecf-directory}:${DIRECTORY_TAG:-1.6.1}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4080
      DATABASE_URL: postgresql://${POSTGRES_USER:-dgii}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dgii_directory}
      API_KEY: ${API_KEY:?API_KEY is required}
      DGII_SOURCE: ${DGII_SOURCE:-txt}
      SYNC_CRON: "${SYNC_CRON:-0 */12 * * *}"
      SYNC_ON_STARTUP: ${SYNC_ON_STARTUP:-true}
      TZ: ${TZ:-America/Santo_Domingo}
      DGII_ELECTRONIC_DIRECTORY_ENABLED: ${DGII_ELECTRONIC_DIRECTORY_ENABLED:-true}
      DIRECTORY_CACHE_TTL_SECONDS: ${DIRECTORY_CACHE_TTL_SECONDS:-43200}
      DIRECTORY_TIMEOUT_MS: ${DIRECTORY_TIMEOUT_MS:-10000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_IMPORT_AGE_HOURS: ${MAX_IMPORT_AGE_HOURS:-25}
      DGII_CREDENTIALS_MASTER_KEY: ${DGII_CREDENTIALS_MASTER_KEY:?DGII_CREDENTIALS_MASTER_KEY is required}
      DGII_CERTIFICATE_MAX_BYTES: ${DGII_CERTIFICATE_MAX_BYTES:-2097152}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-104857600}
      MAX_UNCOMPRESSED_BYTES: ${MAX_UNCOMPRESSED_BYTES:-314572800}
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4080/health/live >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-1.0}
          memory: ${API_MEMORY_LIMIT:-1G}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-http.rule=Host(`${URL}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-http.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-https-redirect
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}.rule=Host(`${URL}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-ecf-directory}.loadbalancer.server.port=4080
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  postgres_data:

networks:
  proxy:
    name: ${NETWORK:-proxy}
    external: true
  internal:
    internal: true
