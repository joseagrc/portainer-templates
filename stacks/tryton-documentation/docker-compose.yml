x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  documentation:
    container_name: ${COMPOSE_PROJECT_NAME:-tryton-documentation}-app
    image: ${DOCUSAURUS_IMAGE:-unpaismejor/docusaurus-tryton}:${DOCUSAURUS_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      WORKSPACE_NAME: public
      WORKSPACE_IS_GIT_REPO: "false"
      DOCUSAURUS_URL: https://${SITE_URL:-docs.tryton.org.do}
      DOCUSAURUS_BASE_URL: /
      DOCUSAURUS_SCAFFOLD_DOCS: "true"
      DOCUSAURUS_SCAFFOLD_OVERWRITE: ${DOCUSAURUS_SCAFFOLD_OVERWRITE:-false}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
    volumes:
      - webpage:/webdir/public
    networks:
      - proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}-http.rule=Host(`${SITE_URL:-docs.tryton.org.do}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}-http.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}-http.middlewares=${COMPOSE_PROJECT_NAME:-tryton-documentation}-https-redirect
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-tryton-documentation}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}.rule=Host(`${SITE_URL:-docs.tryton.org.do}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-tryton-documentation}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-tryton-documentation}.loadbalancer.server.port=3000

volumes:
  webpage:
    name: ${COMPOSE_PROJECT_NAME:-tryton-documentation}_webpage

networks:
  proxy:
    name: ${NETWORK:-proxy}
    external: true
