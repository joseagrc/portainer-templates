services:
  uptime-kuma:
    container_name: ${COMPOSE_PROJECT_NAME:-uptime-kuma}
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma}:${UPTIME_KUMA_TAG:-2}
    restart: unless-stopped
    volumes:
      - ${UPTIME_KUMA_DATA_DIR:-/srv/docker/uptime-kuma/data}:/app/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${NETWORK:-proxy}
      traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-uptime-kuma}-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}-http.entrypoints: web
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}-http.middlewares: ${COMPOSE_PROJECT_NAME:-uptime-kuma}-https-redirect
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}-http.rule: Host(`${DOMAIN:-uptime.example.com}`)
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}.entrypoints: websecure
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}.rule: Host(`${DOMAIN:-uptime.example.com}`)
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}.tls: "true"
      traefik.http.routers.${COMPOSE_PROJECT_NAME:-uptime-kuma}.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.${COMPOSE_PROJECT_NAME:-uptime-kuma}.loadbalancer.server.port: "3001"

networks:
  default:
    name: ${NETWORK:-proxy}
    external: true
