version: '3'

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    hostname: 0.0.0.0
    image: ${POSTGRES_IMAGE}:${POSTGRES_TAG}
    restart: unless-stopped
    volumes:
      - tryton_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
  tryton:
    container_name: ${COMPOSE_PROJECT_NAME}-app
    image: ${TRYTON_IMAGE}:${TRYTON_TAG}
    restart: unless-stopped
    depends_on:
      - postgres
    # links:
    #   - postgres:postgres
    volumes:
      - tryton_data:/var/lib/trytond/db
    command: sh -c "trytond-admin -vv -d ${POSTGRES_DB} --all -l ${TRYTOND_LANGUAGE} --email ${TRYTOND_ADMIN_EMAIL} --password"
    environment:
      TRYTOND_EMAIL__FROM: ${EMAIL_FROM}
      TRYTOND_EMAIL__URI: smtp://mailhog:1025
      TRYTOND_DATABASE__URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      TRYTOND_ADMIN_PASSWORD: ${TRYTOND_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK:-proxy}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=Host(`${URL_DOMAIN}`) || Host(`www.${URL_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=${COMPOSE_PROJECT_NAME}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${URL_DOMAIN}`) || Host(`www.${URL_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8000"

  tryton-cron:
    container_name: ${COMPOSE_PROJECT_NAME}-cron
    image: ${TRYTON_IMAGE}:${TRYTON_TAG}
    command: trytond-cron -d ${POSTGRES_DB}
    volumes:
      - tryton_data:/var/lib/trytond/db
    depends_on:
      - postgres
    restart: always

  tryton-bus:
    container_name: ${COMPOSE_PROJECT_NAME}-bus
    image: ${TRYTON_IMAGE}:${TRYTON_TAG}
    command: trytond --coroutine
#    ports:
#      - ${TRYTON_BUS_PORT}:8000
    depends_on:
      - postgres
    # links:
    #   - postgres:postgres
    environment:
      TRYTOND_BUS__ALLOW_SUBSCRIBE: true
      TRYTOND_WEB__CORS: 
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  tryton-update:
    container_name: ${COMPOSE_PROJECT_NAME}-update
    image: ${TRYTON_IMAGE}:${TRYTON_TAG}
    command: sh -c "trytond-admin -d ${POSTGRES_DB} --all ---activate-dependencies -v && tail -f /dev/null"
    volumes:
      - tryton_data:/var/lib/trytond/db
    depends_on:
      - postgres
    restart: "no"

  mailhog:
    container_name: ${COMPOSE_PROJECT_NAME}-mailhog
    image: mailhog/mailhog:latest
    restart: always
volumes:
  tryton_db:
  tryton_data:

networks:
  default:
    name: ${NETWORK}
    external: true
