services:
  mysql:
    image: ${MYSQL_IMAGE:-gitea.joseagrc.com/joseagrc/phorge-mysql}:${MYSQL_TAG:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Database root password is required}
    volumes:
      - phorge_db:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --silent --host=127.0.0.1 --user=root"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  phorge:
    image: ${PHORGE_IMAGE:-gitea.joseagrc.com/joseagrc/phorge}:${PHORGE_TAG:-2026.27}
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Database root password is required}
      PHORGE_BASE_URI: https://${URL_DOMAIN:?Public domain is required}/
      PHORGE_ALT_FILE_DOMAIN: https://${FILE_DOMAIN:-cdn.code.joseagrc.com}/
      PHORGE_COMMAND_LOCALE: ${PHORGE_COMMAND_LOCALE:-en_US}
      PHORGE_DEFAULT_LOCALE: ${PHORGE_DEFAULT_LOCALE:-en_US}
      PHORGE_ENABLE_PASSWORD_LOGIN: ${PHORGE_ENABLE_PASSWORD_LOGIN:-true}
      PHORGE_LOCK_LOGIN_CONFIG: ${PHORGE_LOCK_LOGIN_CONFIG:-true}
      PHORGE_FILE_STORAGE_PATH: /var/lib/phorge/files
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      OPCACHE_VALIDATE_TIMESTAMPS: "0"
      PHORGE_UI_LOGO_JSON: '${PHORGE_UI_LOGO_JSON:-{"wordmarkText":"Code"}}'
      PHORGE_UI_HEADER_COLOR: ${PHORGE_UI_HEADER_COLOR:-}
      PHORGE_UI_FAVICONS_JSON: '${PHORGE_UI_FAVICONS_JSON:-}'
      PHORGE_UI_FOOTER_ITEMS_JSON: '${PHORGE_UI_FOOTER_ITEMS_JSON:-}'
      PHORGE_TRANSLATION_OVERRIDE_JSON: '${PHORGE_TRANSLATION_OVERRIDE_JSON:-}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-tls}
      TRUST_PROXY_HEADERS: "1"
      UPGRADE_ON_RESTART: "true"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${NETWORK:-proxy}
      traefik.http.middlewares.code-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.code-http.entrypoints: web
      traefik.http.routers.code-http.middlewares: code-https-redirect
      traefik.http.routers.code-http.rule: Host(`${URL_DOMAIN:?Public domain is required}`)
      traefik.http.routers.code.entrypoints: websecure
      traefik.http.routers.code.rule: Host(`${URL_DOMAIN:?Public domain is required}`)
      traefik.http.routers.code.tls: "true"
      traefik.http.routers.code.tls.certresolver: letsencrypt
      traefik.http.routers.code-files.entrypoints: websecure
      traefik.http.routers.code-files.rule: Host(`${FILE_DOMAIN:-cdn.code.joseagrc.com}`)
      traefik.http.routers.code-files.tls: "true"
      traefik.http.routers.code-files.tls.certresolver: letsencrypt
      traefik.http.services.code.loadbalancer.server.port: "80"
    volumes:
      - phorge_conf:/opt/phabricator/conf/local
      - phorge_files:/var/lib/phorge/files
      - phorge_repo:/var/repo
      - phorge_ssh:/home/app/.ssh
    networks:
      - database
      - proxy
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  phorge_conf:
  phorge_db:
  phorge_files:
  phorge_repo:
  phorge_ssh:

networks:
  database:
    internal: true
  proxy:
    external: true
    name: ${NETWORK:-proxy}
