x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-base: &base
  image: "${CHATWOOT_IMAGE}:${CHATWOOT_TAG}"
  env_file: .env
  volumes:
    - chatwoot-storage:/app/storage
  networks: [internal]
  restart: unless-stopped
  logging: *default-logging
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_DATABASE: "${POSTGRES_DB}"
    POSTGRES_USERNAME: "${POSTGRES_USER}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"

services:
  rails:
    <<: *base
    container_name: ${COMPOSE_PROJECT_NAME}-rails
    networks: [internal, proxy]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=Host(`${CHATWOOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=${COMPOSE_PROJECT_NAME}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${CHATWOOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"

  sidekiq:
    <<: *base
    container_name: ${COMPOSE_PROJECT_NAME}-sidekiq
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: "${POSTGRES_IMAGE}:${POSTGRES_TAG}"
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes: [chatwoot-postgres:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: "${REDIS_IMAGE}:${REDIS_TAG}"
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes: [chatwoot-redis:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

volumes:
  chatwoot-storage: {name: ${COMPOSE_PROJECT_NAME}-storage}
  chatwoot-postgres: {name: ${COMPOSE_PROJECT_NAME}-postgres}
  chatwoot-redis: {name: ${COMPOSE_PROJECT_NAME}-redis}

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME}_internal
    internal: true
  proxy:
    name: ${NETWORK}
    external: true
