name: Validate templates

on:
  push:
  pull_request:

jobs:
  traefik-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Traefik multi-instance conventions
        run: python scripts/validate_traefik_templates.py

